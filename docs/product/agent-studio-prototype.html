<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Agent Studio 시안 v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
 * Agent Studio 시안 v2 — 실제 앱(src/app/globals.css)의 토큰을 이어받는다.
 * 회색 면 위에 잉크색 하나(--accent)만 강조로 쓰고, 상태는 색이 아니라 굵기 · 테두리 · 점선으로 구분한다.
 */
:root{
  --bg:#f8f9fa; --surface:#fff; --surface-2:#fcfcfd; --sunken:#f3f4f6; --proto:#eceef1;
  --ink:#20252d; --ink-2:#343d48; --muted:#69717c; --faint:#8b939d;
  --line:#e6e8eb; --line-2:#d5d9de; --line-strong:#aab1b9;
  --accent:#242c38; --accent-hover:#101720; --on-accent:#fff; --accent-soft:#eef0f2;
  --focus:#697483; --scrim:rgba(20,24,30,.42);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
  font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:14px; color:var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --surface:#1c2025; --surface-2:#1f2329; --sunken:#181b1f; --proto:#101215;
    --ink:#e6e9ed; --ink-2:#cdd2d8; --muted:#9aa2ac; --faint:#7f8791;
    --line:#2b3037; --line-2:#363c44; --line-strong:#58606b;
    --accent:#e6e9ed; --accent-hover:#ffffff; --on-accent:#15181c; --accent-soft:#272c33;
    --focus:#9aa2ac; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1c2025; --surface-2:#1f2329; --sunken:#181b1f; --proto:#101215;
  --ink:#e6e9ed; --ink-2:#cdd2d8; --muted:#9aa2ac; --faint:#7f8791;
  --line:#2b3037; --line-2:#363c44; --line-strong:#58606b;
  --accent:#e6e9ed; --accent-hover:#ffffff; --on-accent:#15181c; --accent-soft:#272c33;
  --focus:#9aa2ac; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin-top:0}
code,.mono{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* ── 시안 조작 띠 (앱 바깥) ── */
.proto{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 18px;background:var(--proto);border-bottom:1px dashed var(--line-strong);font-size:12px;color:var(--ink-2)}
.proto-tag{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border:1px dashed var(--line-strong);border-radius:6px;white-space:nowrap}
.proto-group{display:flex;align-items:center;gap:6px;white-space:nowrap}
.proto-group > span{color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:650;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:800}
.proto-link{border:0;background:none;padding:0;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.proto-desc{flex-basis:100%;color:var(--muted);font-size:12px;margin:0;line-height:1.5}
.proto-desc b{color:var(--ink-2)}
.later{border:1px dashed var(--line-strong);border-radius:6px;padding:2px 8px;color:var(--muted)}

/* ── 무대: 데스크톱은 꽉 차게, Phone 은 390px 틀 ── */
.stage{flex:1;min-height:0;display:flex}
.stage.phone{justify-content:center;align-items:flex-start;overflow:auto;padding:22px 12px;background:var(--proto)}
#app{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative;container:app / inline-size}
.stage.phone #app{flex:none;width:390px;height:min(820px,calc(100dvh - 150px));min-height:560px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden}

/* ── 앱: 위쪽 띠 ── */
.topbar{flex:none;height:56px;display:flex;align-items:center;gap:24px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:14px}
.nav{display:flex;gap:2px}
.nav button{height:36px;border:0;background:transparent;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:650}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:750}
.nav .count{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--muted)}

.sourcebar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 24px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.pill{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:2px 9px;font-weight:700;color:var(--ink);white-space:nowrap}
.pill.off{color:var(--faint);border-style:dashed}
.sb-push{margin-left:auto}

.main{flex:1;min-height:0;overflow:auto}
.main.flush{overflow:hidden}
.page{padding:28px clamp(16px,4vw,56px) 72px}
.inner{max-width:1060px;margin:0 auto}
.inner.narrow{max-width:860px}

/* ── 공통 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:720;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken);border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.tiny{min-height:26px;padding:0 9px;font-size:11px}
.btn.text{border-color:transparent;background:transparent;padding:0 6px;min-height:26px}
.btn.text:hover{background:var(--sunken)}
.btn[disabled]{opacity:.5;cursor:not-allowed;background:var(--sunken)}
.muted{color:var(--muted);font-size:12px;margin:0}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--faint);margin:0 0 6px}
.why{font-size:12px;color:var(--muted);line-height:1.45}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h1{font-size:26px;letter-spacing:-.04em;margin:0 0 4px;font-weight:780}
.title-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.title-line h1{margin:0}

.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 9px;border:1px solid transparent;background:var(--sunken);color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-draft::before{background:transparent;border:1.5px solid currentColor;width:4px;height:4px}
.st-in_progress{color:var(--ink-2)}
.st-needs_review{color:var(--ink);background:var(--accent-soft);border-color:var(--line-strong);font-weight:800}
.st-done_candidate{color:var(--ink);border:1px dashed var(--line-strong);background:transparent}
.st-done{color:var(--faint)}
.st-done::before{content:"✓";width:auto;height:auto;background:none;border-radius:0;font-size:11px}

.chip{display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.quiet{color:var(--faint)}
.chip.strong{border-color:var(--line-strong);color:var(--ink);font-weight:750}
.chip.dashed{border-style:dashed;color:var(--faint)}
.part-label .sha,.eyebrow .sha{text-transform:none;letter-spacing:0}
.sha{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.01em}

.marker{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.marker code{font-size:13px;font-weight:700;background:var(--accent-soft);border-radius:7px;padding:4px 9px;user-select:all}

/* ── Workspace ── */
.attn{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;margin-bottom:30px;overflow:hidden}
.attn-head{display:flex;align-items:baseline;gap:10px;padding:14px 18px 12px}
.attn-head h2{font-size:16px;letter-spacing:-.02em;margin:0}
.attn-head small{font-family:var(--mono);color:var(--muted);font-weight:600}
.attn-row{width:100%;display:grid;grid-template-columns:130px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 18px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.attn-row:hover{background:var(--surface-2)}
.attn-row:hover .go{text-decoration:underline}
.kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-2)}
.attn-text{font-size:13px;line-height:1.45}
.attn-text .muted{display:block;margin-top:1px}
.go{font-size:12px;font-weight:700;white-space:nowrap}
.attn.empty{border-left-color:var(--line-strong)}
.attn.empty p{padding:0 18px 16px;margin:0}

.newwork{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:16px 18px;margin-bottom:26px}
.form-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:750;color:var(--muted)}
.field input,.field select{min-height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink)}
.field.grow{flex:1;min-width:200px}

.project{margin-bottom:30px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.sec-head h2{font-size:16px;letter-spacing:-.02em;margin:0}
.sec-head small{color:var(--faint);font-weight:650;font-family:var(--mono);font-size:11px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:8px}
.wrow-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wtitle{border:0;background:none;padding:0;text-align:left;font-weight:750;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;color:var(--ink)}
.wtitle:hover{text-decoration-thickness:2px}
.prlines{display:grid;gap:5px;margin-top:9px}
.prline{display:grid;grid-template-columns:220px 290px minmax(0,1fr);align-items:center;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.prline .id{font-weight:700;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.who + .sep + .who{border-left:1px solid var(--line-2);padding-left:14px}
.who > b{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:800}
.sep{display:none}
.empty-note{color:var(--muted);font-size:12px;margin:8px 0 0}

/* ── PR 카드 ── */
.legend{font-size:12px;color:var(--muted);margin:0 0 10px}
.cards{display:grid;gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 10px}
.card-id{font-size:13px;font-weight:780}
.card-title{font-size:13px;color:var(--ink-2)}
.card-link{margin-left:auto;font-size:11px;font-weight:700;border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.card-meta{color:var(--muted);font-size:11px;margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.rows{margin:0;display:grid;gap:6px}
.row{display:grid;grid-template-columns:62px 1fr;align-items:start;gap:8px}
.row dt{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--faint);padding-top:4px}
.row dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.part{border-top:1px solid var(--line);margin-top:12px;padding-top:11px;display:grid;gap:8px}
.part-label{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--faint);margin:0}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pv-line{margin:0;font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pv-url{font-family:var(--mono);font-size:11.5px;background:var(--sunken);padding:1px 6px;border-radius:5px;word-break:break-all}
.pv-steps{display:flex;gap:4px;align-items:center}
.pv-steps i{width:22px;height:4px;border-radius:2px;background:var(--line-2);display:block}
.pv-steps i.on{background:var(--ink)}
.pv-outdated{margin:0;font-size:12px;font-weight:500;color:var(--ink);border-left:3px dashed var(--line-strong);padding-left:9px;line-height:1.5}
.pv-fail{margin:0;font-size:12px;color:var(--ink);border-left:3px solid var(--ink);padding-left:9px;line-height:1.5}
.pv-log{margin:0;max-height:120px;overflow:auto;background:var(--sunken);border-radius:7px;padding:8px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.approve-note{font-size:11px;color:var(--muted)}
.decision{font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.unlink{border-top:1px dashed var(--line-2);margin-top:12px;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12px;color:var(--muted)}
.unlink label{display:flex;align-items:center;gap:6px}
.demo-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px dashed var(--line-strong);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted)}
.demo-strip b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-2)}
.demo-strip button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-2)}
.demo-strip button[aria-pressed="true"]{border-color:var(--ink);font-weight:800;color:var(--ink)}

.inbox-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.inbox-item .card{border:0;padding:0;background:transparent}
.reason{font-size:12px;color:var(--ink-2);margin:10px 0;line-height:1.5;border-left:3px solid var(--line-2);padding-left:9px}
.hint{font-size:12px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;margin:0 0 18px;line-height:1.5}

/* ── 2.5단계 Chat ── */
.chat{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;position:relative}
.chat.thread-open{grid-template-columns:236px minmax(0,1fr) 330px}
.channels{border-right:1px solid var(--line);background:var(--sunken);overflow:auto;padding:14px 8px 24px}
.ch-group{margin-bottom:14px}
.ch-group h4{font-size:11px;font-weight:800;color:var(--muted);margin:0 8px 5px;letter-spacing:-.01em}
.ch{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:6px 10px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:13px;color:var(--ink-2)}
.ch:hover{background:var(--surface)}
.ch[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:750;box-shadow:inset 0 0 0 1px var(--line-2)}
.ch .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .s{font-size:10px;color:var(--faint);white-space:nowrap}
.ch .s.hot{color:var(--ink);font-weight:800}
.ch-foot{font-size:11px;color:var(--faint);padding:8px 10px;line-height:1.5}
.tl-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.tl-head{flex:none;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.tl-head h1{font-size:18px;letter-spacing:-.03em;margin:0}
.tl-head .row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tl-head .row1 .spacer{flex:1}
.back{display:none}
.tl{flex:1;overflow:auto;padding:14px 22px 24px}
.day{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:11px;font-weight:750;color:var(--faint)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:4px 0}
.ev time{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
.ev-sys{font-size:12px;color:var(--muted);line-height:1.5}
.src{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:0 5px;border-radius:4px;margin-right:6px;vertical-align:1px}
.src.gh{border:1px solid var(--line-strong);color:var(--ink-2)}
.src.studio{background:var(--accent-soft);color:var(--ink-2);border:1px solid var(--accent-soft)}
.ev-state{font-size:12px;color:var(--ink);line-height:1.5;border-left:2px solid var(--ink);padding-left:9px}
.ev-state .muted{display:inline}
.memo{font-size:13px;line-height:1.55}
.memo .by{font-weight:780;margin-right:8px}
.memo .by small{font-weight:500;color:var(--faint);font-size:11px;margin-left:4px}
.ev-foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.replies{font-size:11px;font-weight:700;color:var(--ink-2);border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px}
.ev.ev-card{grid-template-columns:42px minmax(0,1fr)}
.new-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:5px;padding:0 6px;color:var(--ink)}
.card.old{opacity:.6;background:var(--surface-2)}
.card.old:hover{opacity:.85}
.old-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line-strong);border-radius:5px;padding:0 6px;color:var(--muted)}
.old-note{font-size:11px;color:var(--muted);margin:10px 0 0}
.composer{flex:none;border-top:1px solid var(--line);padding:10px 22px 12px;background:var(--surface)}
.composer-box{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:40px;max-height:120px;resize:vertical;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;background:var(--surface);font-size:13px}
.composer .note{font-size:11px;color:var(--muted);margin:6px 0 0}
.thread{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.thread-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.thread-head h3{font-size:14px;margin:0}
.thread-head small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.thread-body{flex:1;overflow:auto;padding:12px 16px}
.thread-root{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:10px;font-size:12px;color:var(--ink-2);line-height:1.5}
.reply{padding:6px 0;font-size:13px;line-height:1.5}

/* ── 휴대전화에서 연 미리보기 (앱 밖 창을 흉내) ── */

/* ───────────── 조각: PR 카드 ───────────── */
function reviewChips(k, commit) {

  const label = r.verdict === "done" ? "Internal: review done" : "Internal: changes requested";
  return r.commit === commit
    ? `<span class="chip strong">${label} · 커밋 <span class="sha">${r.commit}</span></span>`
    : `<span class="chip dashed">${label} · 이전 커밋 <span class="sha">${r.commit}</span> 에 대한 결정</span>`;
}
function previewChip(k) {

  if (v.kind === "outdated") return `<span class="chip dashed">Preview <span class="sha">${S.pv.commit}</span> · 이전 버전</span>`;
  if (v.kind === "preparing") return `<span class="chip">Preview · ${PHASE[S.pv.phase]}</span>`;

}
function previewPart(k, opts) {

    body = `<p class="pv-line"><span class="chip strong">${PHASE[pv.phase]}</span> PR #${p.num} · 커밋 <span class="sha">${pv.commit}</span>
      <span class="pv-steps" aria-label="${i + 1} / 3 단계">${[0, 1, 2].map((n) => `<i class="${n <= i ? "on" : ""}"></i>`).join("")}</span><span class="why">${i + 1}/3 · Mac Pro 가 이 커밋을 받아 실행하고 있다</span></p>
      ${pv.replaced ? `<p class="why">동시에 하나만 돈다 — 앞서 돌던 ${prId(pv.replaced.pr)} · <span class="sha">${pv.replaced.commit}</span> 미리보기를 종료했다.</p>` : ""}
      <div class="actions"><button class="btn" disabled aria-describedby="r-${k}">Open Preview</button><span class="why" id="r-${k}">준비 중이다. 끝나면 주소가 나타난다.</span>${stop}</div>`;
  } else if (v.kind === "running") {
    body = `<p class="pv-line"><span class="chip strong">Running</span> PR #${p.num} · 커밋 <span class="sha">${pv.commit}</span> · <span class="pv-url">http://mac-pro.tail0c2e.ts.net:44181</span></p>
      ${pv.replaced ? `<p class="why">동시에 하나만 돈다 — 앞서 돌던 ${prId(pv.replaced.pr)} · <span class="sha">${pv.replaced.commit}</span> 미리보기를 종료했다.</p>` : ""}
      <div class="actions"><button class="btn primary" data-act="pv-open">Open</button>${stop}<span class="why">휴대전화에서도 같은 주소로 열린다(사설망 안에서).</span></div>`;
  } else if (v.kind === "outdated") {
    body = `<p class="pv-line"><span class="chip dashed">Running · 이전 버전</span> PR #${p.num} · 커밋 <span class="sha">${pv.commit}</span> · <span class="pv-url">http://mac-pro.tail0c2e.ts.net:44181</span></p>
      <p class="pv-outdated"><b>이전 버전</b> — 이 미리보기는 커밋 ${pv.commit} 이고, PR 의 최신 커밋은 ${p.head} 이다. 검토 근거로 쓰지 않는다. Open Preview 로 최신 커밋을 다시 연다.</p>
      <div class="actions">${open}${stop}</div>`;

      <details><summary>Log (최근 4줄)</summary><pre class="pv-log">npm ERR! code EUSAGE
npm ERR! \`npm ci\` can only install packages when your package.json and package-lock.json are in sync.
npm ERR! Missing: otplib@12.0.1 from lock file

      ${[["idle", "Ready"], ["offline", "Not connected"], ["preparing", "Preparing"], ["running", "Running"], ["failed", "Failed"], ["outdated", "Outdated"]].map(([val, l]) => `<button data-act="pv-demo" data-pr="${k}" data-v="${val}" aria-pressed="${v.kind === val}">${l}</button>`).join("")}</div>` : "";

}
function reviewPart(k) {

      <button class="btn" data-act="review" data-pr="${k}" data-v="changes">Request Changes</button>
      <button class="btn ${approvePrimary ? "primary" : ""}" data-act="review" data-pr="${k}" data-v="done">Approve</button>

function prCard(k, opts = {}) {

      ${old ? `<span class="old-tag">이전 커밋</span>` : opts.context === "chat" && p.commits.length > 1 ? `<span class="new-tag">최신 커밋</span>` : ""}

/* ───────────── 화면: Workspace ───────────── */

/* ───────────── 화면: 업무 (2단계) ───────────── */
function workHeadBits(w) {

/* ───────────── 화면: Chat (2.5단계) ───────────── */
function timelineFor(w) {

function renderChat() {
  const w = work(S.workId);
  const { done, hint } = workHeadBits(w);
  const channels = PROJECTS.map((pj) => `<div class="ch-group"><h4>${esc(pj.name)}</h4>
    ${WORKS.filter((x) => x.project === pj.id).map((x) => `<button class="ch" data-act="channel" data-v="${x.id}" aria-current="${x.id === w.id}"><span class="t">${esc(x.title)}</span><span class="s ${x.status === "needs_review" ? "hot" : ""}">${STATUS[x.status]}</span></button>`).join("")}</div>`).join("")
    + `<p class="ch-foot">채널 하나가 업무 하나다. 새 업무는 Workspace 의 New Work 로 만든다.</p>`;
  let thread = "";
  if (S.thread) {
    const [kind, a, b] = S.thread.split(":");
    const root = kind === "card" ? `<b>${prId(a)}</b> · 커밋 <span class="sha">${b}</span><br>${esc(PR[a].title)}` : esc((timelineFor(w).find((e) => e.id === a) || {}).text || "");
    const title = kind === "card" ? `${prId(a)} · ${b}` : "메모";
    thread = `<aside class="thread" aria-label="Thread"><div class="thread-head"><div><h3>Thread</h3><small>${title}</small></div><button class="btn tiny" data-act="thread-close">Close</button></div>
      <div class="thread-body"><div class="thread-root">${root}${kind === "card" ? `<p class="why" style="margin:6px 0 0">이 스레드는 이 커밋의 카드에 붙는다. 새 커밋이 오면 새 카드에서 새 스레드가 시작된다.</p>` : ""}</div>
      ${(THREADS[S.thread] || []).map((r) => `<div class="reply"><span class="memo"><span class="by">나<small>${r.at}</small></span></span><br>${esc(r.text)}</div>`).join("") || `<p class="muted">아직 답글이 없다.</p>`}</div>
      <div class="composer"><div class="composer-box"><textarea id="reply-in" rows="1" placeholder="답글을 남긴다"></textarea><button class="btn" data-act="reply-send">Reply</button></div><p class="note">답글도 AI 에게 전달되지 않는다.</p></div></aside>`;
  }
  return `<div class="chat ${S.thread ? "thread-open" : ""} ${S.showChannels ? "show-channels" : ""}">
    <nav class="channels" aria-label="Channels">${channels}</nav>
    <section class="tl-col" aria-label="Timeline">
      <header class="tl-head">
        <div class="row1"><button class="btn tiny back" data-act="show-channels">‹ Channels</button><h1>${esc(w.title)}</h1>${statusBadge(w.status)}<span class="spacer"></span>${done}</div>
        <div class="marker"><code style="font-size:11.5px;padding:2px 7px">studio-work-${w.id}</code><button class="btn tiny" data-act="copy" data-v="studio-work-${w.id}">Copy</button><span class="why">${esc(proj(w.project).name)} · 상태 이력: ${esc(w.why)}</span></div>
        ${hint}
      </header>
      <div class="tl" id="tl">${timelineFor(w).map(renderEvent).join("")}</div>
      <div class="composer"><div class="composer-box"><textarea id="memo-in" rows="1" placeholder="판단의 이유를 메모로 남긴다"></textarea><button class="btn" data-act="memo-send">Send</button></div>
        <p class="note">메모는 AI 에게 전달되지 않는다. 첫 버전은 나 혼자 보는 기록이다.</p></div>
    </section>
    ${thread}
  </div>`;
}

/* ───────────── 휴대전화에서 연 미리보기 창 ───────────── */
function renderOverlay() {
  if (!S.overlay || !S.pv) return "";
  const p = PR[S.pv.pr];
  return `<div class="pv-overlay" role="dialog" aria-label="미리보기 창"><div class="pv-window">
    <div class="pv-bar"><span class="addr">mac-pro.tail0c2e.ts.net:44181/admin/login</span><button data-act="overlay-close">Close</button></div>
    <div class="pv-stamp">미리보기 · ${p.repo} #${p.num} · 커밋 ${S.pv.commit}</div>
    <div class="pv-app"><h5>관리자 로그인</h5><p>휴대전화 인증 앱에 표시된 인증 코드 6자리를 입력하세요.</p>
      <div class="otp"><span>4</span><span>8</span><span>1</span><span></span><span></span><span></span></div>
      <div class="go-btn">확인</div><p style="font-size:11px">이 창은 시안의 흉내다. 실제로는 휴대전화 브라우저에 PR 커밋의 앱이 뜬다.</p></div>
  </div></div>`;
}

/* ───────────── 그리기 ───────────── */
function render(keepScroll) {
  const root = document.documentElement;
  if (S.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", S.theme);
  $("#stage").className = "stage" + (S.device === "phone" ? " phone" : "");
  renderProto();
  const main = $(".main");
  const y = keepScroll && main ? main.scrollTop : 0;
  const tlY = keepScroll && $("#tl") ? $("#tl").scrollTop : null;
  let body, flush = false;
  if (S.view === "workspace") body = renderWorkspace();
  else if (S.view === "inbox") body = renderInbox();
  else if (S.view === "work" && S.stage === "2") body = renderWork();
  else { body = renderChat(); flush = true; }
  $("#app").innerHTML = renderTop() + `<main class="main ${flush ? "flush" : ""}">${body}</main>` + renderOverlay();
  if (keepScroll) { const m = $(".main"); if (m) m.scrollTop = y; }
  const tl = $("#tl");
  if (tl) tl.scrollTop = tlY !== null ? tlY : tl.scrollHeight;
}

/* ───────────── 동작 ───────────── */
function setPv(v) { clearTimeout(pvTimer); S.pv = v; }
function startPreview(k) {
  const prev = S.pv && S.pv.pr !== k && S.pv.phase !== "failed" ? { pr: S.pv.pr, commit: S.pv.commit } : null;
  setPv({ pr: k, commit: PR[k].head, phase: "fetching", replaced: prev, failure: null });
  const seq = ["installing", "starting", "running"];
  const step = () => { const n = seq.shift(); if (!n || !S.pv || S.pv.pr !== k) return; S.pv.phase = n; render(true); if (seq.length) pvTimer = setTimeout(step, 1100); };
  pvTimer = setTimeout(step, 1000);
}
function applyReview(k, v) {
  const p = PR[k];
  REVIEWS[k] = { verdict: v, commit: p.head };
  const w = WORKS.find((x) => x.prs.includes(k));
  const tl = TIMELINE[w.id];
  const label = v === "done" ? "Approve — Internal: review done" : "Request Changes — Internal: changes requested";
  if (tl) tl.push({ t: "sys", src: "studio", at: "방금", html: `#${p.num} · <span class='sha'>${p.head}</span> 에 ${label}` });
  // R2 · R3: 볼 PR 이 남았는지로 정한다
  const stillNeeds = w.prs.some((x) => PR[x].state === "open" && PR[x].checks !== "failing" && PR[x].checks !== "pending" && !(REVIEWS[x] && REVIEWS[x].commit === PR[x].head));
  const next = stillNeeds ? "needs_review" : "in_progress";
  if (next !== w.status) {
    const note = v === "changes" ? `규칙 R3 · #${p.num} 에 Request Changes` : `#${p.num} 내부 검토 완료 — GitHub 병합을 기다린다`;
    if (tl) tl.push({ t: "state", at: "방금", from: w.status, to: next, note });
    w.status = next; w.why = `${note} · 방금`;
  }
  toast(v === "done" ? `#${p.num} · ${p.head} 에 내부 검토 완료를 남겼다. GitHub 는 그대로다.` : `#${p.num} · ${p.head} 에 수정 요청을 남겼다.`);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, k = el.dataset.pr;
  switch (a) {
    case "set":
      S[el.dataset.k] = v;
      if (el.dataset.k === "stage") { S.thread = null; S.showChannels = false; if (S.view === "work" || S.view === "chat") S.view = v === "2" ? "work" : "chat"; }
      render(); break;
    case "toggle-empty": S.attnEmpty = !S.attnEmpty; S.view = "workspace"; render(); break;
    case "nav":
      S.view = v === "chat" ? "chat" : v; S.thread = null; S.showChannels = false; S.overlay = false; render(); break;
    case "open-work": S.workId = v; S.view = S.stage === "2" ? "work" : "chat"; S.thread = null; S.showChannels = false; S.newWork = null; render(); break;
    case "channel": S.workId = v; S.thread = null; S.showChannels = false; render(); break;
    case "show-channels": S.showChannels = true; S.thread = null; render(); break;
    case "sync": S.lastSync = "방금"; toast("GitHub 에서 다시 읽었다. 읽기만 하고 GitHub 에는 아무것도 쓰지 않는다."); render(true); break;
    case "gh": toast("시안에서는 GitHub 로 가지 않는다. 실제 앱에서는 이 PR 의 GitHub 페이지가 열린다."); break;
    case "copy": navigator.clipboard && navigator.clipboard.writeText(v).catch(() => {}); toast(`${v} 를 복사했다.`); break;
    case "nw-open": S.newWork = { step: "form" }; render(true); setTimeout(() => $("#nw-title") && $("#nw-title").focus(), 0); break;
    case "nw-cancel": S.newWork = null; render(true); break;
    case "nw-create": {
      const title = ($("#nw-title").value || "").trim() || "관리자 목록 검색 필터";
      const ids = ["e61b3d", "4c0a9f", "b8d27e"]; const id = ids[S.workSeq++ % 3];
      WORKS.unshift({ id, project: $("#nw-project").value, title, status: "draft", why: "업무를 만들었다 (New Work) · 방금", prs: [] });
      S.newWork = { step: "done", id }; render(true); break;
    }
    case "pv-start": startPreview(k); render(true); break;
    case "pv-stop": setPv(null); toast("미리보기를 종료했다."); render(true); break;
    case "pv-open": S.overlay = true; render(true); break;
    case "overlay-close": S.overlay = false; render(true); break;
    case "pv-demo": {
      S.deviceOnline = v !== "offline"; const p = PR[k];
      if (v === "idle" || v === "offline") setPv(null);
      else if (v === "preparing") setPv({ pr: k, commit: p.head, phase: "installing", replaced: null });
      else if (v === "running") setPv({ pr: k, commit: p.head, phase: "running", replaced: null });
      else if (v === "failed") setPv({ pr: k, commit: p.head, phase: "failed", replaced: null });
      else if (v === "outdated") setPv({ pr: k, commit: p.commits[0] === p.head ? "3c4d5e6" : p.commits[0], phase: "running", replaced: null });
      render(true); break;
    }
    case "review": applyReview(k, v); render(true); break;
    case "mark-done": {
      const w = work(S.workId); const tl = TIMELINE[w.id];
      if (tl) tl.push({ t: "state", at: "방금", from: w.status, to: "done", note: "사람이 Mark as Done 을 눌렀다" });
      w.status = "done"; w.why = "사람이 Mark as Done 을 눌렀다 · 방금"; toast("업무를 완료로 바꿨다. 새 PR 이 연결되면 다시 진행 중이 된다(R5)."); render(true); break;
    }
    case "unlink-check": { const b = el.closest(".unlink").querySelector("[data-act=unlink]"); b.disabled = !el.checked; return; }
    case "unlink": {
      const w = work(S.workId); w.prs = w.prs.filter((x) => x !== k); PR[k].link = null; PR[k].reason = "no_marker"; INBOX.push(k);
      REASONS.no_marker = REASONS.no_marker; toast(`${prId(k)} 를 떼어 Inbox 로 보냈다. 표식이 있어도 다시 자동으로 붙지 않는다.`); render(true); break;
    }
    case "link": {
      const sel = $(`#sel-${k}`); if (!sel.value) { toast("연결할 업무를 먼저 고른다."); return; }
      const w = work(sel.value); w.prs.push(k); PR[k].link = "Linked manually"; INBOX.splice(INBOX.indexOf(k), 1);
      if (w.status === "draft") { w.status = "in_progress"; w.why = `규칙 R1 · ${prId(k)} 연결 · 방금`; }
      toast(`${prId(k)} 를 '${w.title}' 에 연결했다.`); render(true); break;
    }
    case "new-from-pr": {
      const id = ["d3f18a", "9a61c4", "f07b2e"][S.workSeq++ % 3];
      WORKS.push({ id, project: PR[k].project, title: PR[k].title, status: "in_progress", why: `규칙 R1 · ${prId(k)} 로 업무를 만들었다 · 방금`, prs: [k] });
      PR[k].link = "Linked manually"; INBOX.splice(INBOX.indexOf(k), 1);
      S.workId = id; S.view = S.stage === "2" ? "work" : "chat"; toast("PR 로 새 업무를 만들었다."); render(); break;
    }
    case "thread": S.thread = el.dataset.key; render(true); break;
    case "thread-close": S.thread = null; render(true); break;
    case "memo-send": {
      const t = $("#memo-in").value.trim(); if (!t) return;
      timelineFor(work(S.workId)).push({ t: "memo", id: "m" + S.memoSeq++, at: "방금", text: t }); render(); break;
    }
    case "reply-send": {
      const t = $("#reply-in").value.trim(); if (!t) return;
      (THREADS[S.thread] = THREADS[S.thread] || []).push({ at: "방금", text: t }); render(true); break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "memo-in") { e.preventDefault(); $("[data-act=memo-send]").click(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "reply-in") { e.preventDefault(); $("[data-act=reply-send]").click(); }
  if (e.key === "Escape" && (S.overlay || S.thread)) { S.overlay = false; S.thread = null; render(true); }
});
render();
</script>

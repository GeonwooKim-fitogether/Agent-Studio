<script>
(function(){
'use strict';
var KEY='agent-studio-visual-v5';
function icon(name){return '<svg class="icon" aria-hidden="true"><use href="#i-'+name+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function makeSeed(){
  var agents=[
    {id:'researcher',name:'Researcher',role:'시장 자료를 찾고 근거를 정리합니다.',initial:'R',tone:'research',skills:['Web Search','Source Check']},
    {id:'builder',name:'Builder',role:'초안과 실행 가능한 결과물을 만듭니다.',initial:'B',tone:'builder',skills:['Docs','Drafting']},
    {id:'reviewer',name:'Reviewer',role:'결과를 검토하고 수정 사항을 제안합니다.',initial:'V',tone:'review',skills:['Review','Quality Check']}
  ];
  function nodes(prefix){
    return [
      {id:prefix+'-start',type:'start',name:'Brief',detail:'원하는 결과와 완료 기준',owner:'',x:65,y:255},
      {id:prefix+'-research',type:'agent',name:'Research',detail:'자료 조사와 근거 정리',owner:'researcher',x:306,y:124},
      {id:prefix+'-draft',type:'agent',name:'Create',detail:'조사 결과를 바탕으로 초안 작성',owner:'builder',x:557,y:124},
      {id:prefix+'-review',type:'review',name:'Review',detail:'결과 확인 및 수정 결정',owner:'reviewer',x:808,y:124},
      {id:prefix+'-output',type:'output',name:'Output',detail:'최종 결과물',owner:'',x:808,y:387}
    ]
  }
  return {agents:agents,flows:[
    {id:'launch',code:'FLOW 01',title:'신제품 출시 리서치',objective:'시장 반응을 살펴보고 출시 방향을 정리하기',status:'review',progress:3,nodes:nodes('launch'),messages:[
      {id:'m1',role:'you',author:'나',text:'경쟁 제품과 사용자 반응을 살펴보고 출시 방향을 제안해줘.',time:'09:12',nodeId:'launch-start',replies:[]},
      {id:'m2',role:'agent',agentId:'researcher',author:'Researcher',text:'경쟁 제품 8개를 비교했습니다. 고객 반응에서 반복된 요구는 설정의 간편함과 명확한 요금입니다.',time:'09:24',nodeId:'launch-research',replies:[]},
      {id:'m3',role:'agent',agentId:'builder',author:'Builder',text:'조사 내용을 바탕으로 출시 메시지 3가지를 정리했습니다. 첫 번째 안은 초기 사용자에게 가장 직접적입니다.',time:'10:08',nodeId:'launch-draft',replies:[]},
      {id:'m4',role:'system',author:'Activity',text:'초안이 검토 단계에 도착했습니다. 결정이 필요합니다.',time:'10:12',nodeId:'launch-review',replies:[]}
    ]},
    {id:'support',code:'FLOW 02',title:'고객 문의 응대 설계',objective:'문의 유형을 나누고 답변 흐름 설계하기',status:'active',progress:2,nodes:nodes('support'),messages:[
      {id:'m5',role:'you',author:'나',text:'자주 들어오는 질문을 분류하고 답변 흐름을 잡아줘.',time:'어제',nodeId:'support-start',replies:[]},
      {id:'m6',role:'agent',agentId:'researcher',author:'Researcher',text:'문의 5개 유형을 정리했습니다. 결제와 계정 문의는 우선 분리하는 편이 좋겠습니다.',time:'어제',nodeId:'support-research',replies:[]}
    ]},
    {id:'career',code:'FLOW 03',title:'채용 페이지 초안',objective:'지원자가 알아야 할 정보를 간단하게 전달하기',status:'draft',progress:0,nodes:nodes('career'),messages:[
      {id:'m7',role:'you',author:'나',text:'팀 소개와 채용 페이지 초안을 준비하고 싶어.',time:'월요일',nodeId:'career-start',replies:[]}
    ]}
  ]};
}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.flows)&&Array.isArray(s.agents))return s}catch(e){}return makeSeed()}
var data=load();
var SKILLS=[{name:'Web Search',detail:'공개 자료와 근거를 조사합니다.'},{name:'Source Check',detail:'자료의 출처와 정확성을 확인합니다.'},{name:'Docs',detail:'문서 형태로 결과를 정리합니다.'},{name:'Quality Check',detail:'산출물을 검토하고 누락을 찾습니다.'}];
var ui={view:'workspace',flowId:data.flows[0]?data.flows[0].id:null,nodeId:null,threadId:null,editing:false,zoom:1,inbox:false};
var toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('이 브라우저에서는 저장할 수 없습니다.')}}
function flow(){return data.flows.find(function(f){return f.id===ui.flowId})||data.flows[0]}
function agent(id){return data.agents.find(function(a){return a.id===id})}
function node(f,id){return f&&f.nodes.find(function(n){return n.id===id})}
function status(f){return f.status==='review'?'Needs review':f.status==='active'?'In progress':f.status==='done'?'Done':'Draft'}
function statusClass(f){return f.status==='review'?'review':f.status==='active'?'active':f.status==='done'?'done':'draft'}
function labelFor(n){return n.type==='agent'?'AGENT':n.type==='start'?'START':n.type==='review'?'DECISION':n.type==='output'?'OUTPUT':'SKILL'}
function iconFor(type){return type==='agent'?'agents':type==='review'?'check':type==='output'?'file':type==='skill'?'spark':'flow'}
function avatar(a){if(!a)return '<span class="avatar system">✦</span>';return '<span class="avatar '+esc(a.tone||'review')+'">'+esc(a.initial||a.name[0]||'A')+'</span>'}
function people(f){var ids=[];f.nodes.forEach(function(n){if(n.owner&&ids.indexOf(n.owner)<0)ids.push(n.owner)});return ids.map(function(id){return avatar(agent(id))}).join('')}
function stage(f,small){var count=Math.min(5,f.nodes.length),line='';for(var i=0;i<count;i++){var cls=i<f.progress?'complete':i===f.progress?'current':'future';line+='<span class="segment '+cls+'"></span>'}return '<div class="stage-line" aria-label="'+esc(status(f))+'">'+line+'</div>'+(small?'':'<div class="stage-labels"><span>Brief</span><span>Research</span><span>Create</span><span>Review</span><span>Output</span></div>')}
function currentNode(f){return f.nodes[Math.min(f.progress,f.nodes.length-1)]}
function flash(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2700)}
function toast(m){flash(m)}
function setView(view,id,nodeId){if(id)ui.flowId=id;if(nodeId)ui.nodeId=nodeId;ui.view=view;ui.threadId=null;ui.inbox=false;render()}
function render(){var page=document.getElementById('page');page.innerHTML=ui.view==='workspace'?workspace():ui.view==='chat'?chat():ui.view==='flow'?flowView():agentsView();['workspace','chat','flow','agents'].forEach(function(v){var b=document.getElementById('nav-'+v);b.classList.toggle('active',v===ui.view);if(v===ui.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});var pending=data.flows.filter(function(f){return f.status==='review'}).length;var badge=document.getElementById('inbox-count');badge.textContent=pending;badge.hidden=!pending;renderInbox();if(ui.view==='flow'){requestAnimationFrame(function(){setZoom(true);drawEdges();focusSelected()})}if(ui.view==='chat'){var area=document.getElementById('messages');if(area)area.scrollTop=area.scrollHeight}}
function workspace(){var review=data.flows.find(function(f){return f.status==='review'}),attention=review?'<section class="attention" aria-label="Needs attention"><div><span class="eyebrow">Needs your attention</span><h2>'+esc(review.title)+'</h2><p>검토할 결과가 도착했습니다. 다음 단계로 진행할지 결정하세요.</p>'+stage(review,false)+'</div><div class="attention-side"><button class="btn primary" data-action="review" data-flow="'+esc(review.id)+'">Review '+icon('arrow')+'</button></div></section>':'<section class="attention empty"><div><span class="eyebrow">All clear</span><h2>지금 결정할 업무가 없습니다</h2><p>새 업무를 만들거나 진행 중인 업무를 확인하세요.</p></div></section>';

document.addEventListener('change',function(e){if(e.target.dataset.editField==='owner'){var f=flow(),n=node(f,e.target.dataset.node);if(n){n.owner=e.target.value;save();render()}}});
document.addEventListener('blur',function(e){var field=e.target.dataset.editField;if(field!=='name'&&field!=='detail')return;var n=node(flow(),e.target.dataset.node);if(!n)return;var value=e.target.value.trim();if(field==='name'&&!value){e.target.value=n.name;return}n[field]=value;save();if(field==='name'){document.querySelectorAll('.node[data-node="'+n.id+'"] h3').forEach(function(el){el.textContent=value})}},true);
var drag=null;document.addEventListener('pointerdown',function(e){var el=e.target.closest('.node');if(!el||!ui.editing||e.button!==0)return;var n=node(flow(),el.dataset.node);if(!n)return;drag={id:n.id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y,moved:false,el:el};el.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',function(e){if(!drag)return;var n=node(flow(),drag.id);if(!n)return;var dx=(e.clientX-drag.x)/ui.zoom,dy=(e.clientY-drag.y)/ui.zoom;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(!drag.moved)return;n.x=Math.round(Math.max(10,Math.min(885,drag.nx+dx)));n.y=Math.round(Math.max(70,Math.min(480,drag.ny+dy)));drag.el.style.left=n.x+'px';drag.el.style.top=n.y+'px';drawEdges()});document.addEventListener('pointerup',function(){if(drag&&drag.moved)save();drag=null});
window.addEventListener('resize',function(){if(ui.view==='flow')setZoom(true)});
render();
})();
</script>
</body>
</html>

# 앱 CI — 타입 검사 · 단위 테스트 · 빌드 · e2e (docs/plan/01-pr-collection.md §4 "구조를 기계가 지킨다")
#
# e2e 는 빌드된 앱을 띄워 첫 화면(Workspace)에서 출발하는 사용자 흐름을 구동한다.
# GitHub 변수를 주지 않으므로 앱은 고정 데이터(fixture)로 돈다. 이 워크플로는 시크릿을 쓰지 않는다.

name: App CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # 이 러너에는 브라우저가 미리 깔려 있지 않다. 버전은 package-lock.json 의 @playwright/test 를 따른다.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
